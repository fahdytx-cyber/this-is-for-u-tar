<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheer Up, Larissa! 💖</title>
<style>
  :root {
    --bg1: #ffe3ef;
    --bg2: #ffd1e3;
    --bg3: #e9d5ff;
    --card: rgba(255,255,255,0.75);
    --text: #4a2b3a;
    --text-soft: #7a5468;
    --accent: #ff6fa5;
    --accent2: #c084fc;
    --shadow: rgba(255,111,165,0.35);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #2a1a2e;
      --bg2: #3a1f33;
      --bg3: #241a38;
      --card: rgba(40,25,45,0.75);
      --text: #ffe3ef;
      --text-soft: #d9b8c9;
      --accent: #ff8fc0;
      --accent2: #d6a8ff;
      --shadow: rgba(255,143,192,0.25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #2a1a2e;
    --bg2: #3a1f33;
    --bg3: #241a38;
    --card: rgba(40,25,45,0.75);
    --text: #ffe3ef;
    --text-soft: #d9b8c9;
    --accent: #ff8fc0;
    --accent2: #d6a8ff;
    --shadow: rgba(255,143,192,0.25);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    background: linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
    color: var(--text);
    min-height: 100%;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(32px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }
  .hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .heart {
    position: absolute;
    bottom: -10%;
    font-size: 22px;
    opacity: 0.55;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }
  .card {
    position: relative;
    z-index: 1;
    max-width: 480px;
    width: 100%;
    background: var(--card);
    backdrop-filter: blur(10px);
    border-radius: 28px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 50px var(--shadow);
    border: 1px solid rgba(255,255,255,0.3);
  }
  .mascot {
    font-size: 64px;
    display: inline-block;
    animation: bounce 2.2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }
  h1 {
    margin: 10px 0 4px;
    font-size: 1.7rem;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    color: var(--text-soft);
    font-size: 0.95rem;
    margin-bottom: 22px;
  }
  #message {
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    line-height: 1.5;
    padding: 10px 6px;
    font-weight: 500;
  }
  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    border: none;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 999px;
    color: white;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 18px var(--shadow);
    transition: transform 0.15s ease;
  }
  button:active { transform: scale(0.94); }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
    box-shadow: none;
  }
  .counter {
    margin-top: 16px;
    font-size: 0.8rem;
    color: var(--text-soft);
  }
  #hugZone {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }
  .popEmoji {
    position: absolute;
    font-size: 28px;
    animation: popFly 1.6s ease-out forwards;
  }
  @keyframes popFly {
    0% { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-160px) scale(1.3); opacity: 0; }
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>
<div id="hugZone"></div>

<div class="card">
  <div class="mascot">🐻</div>
  <h1>Hey Larissa!</h1>
  <div class="subtitle">A tiny bear showed up just to cheer you on today.</div>
  <div id="message">I heard you’re not feeling your best — so I brought jokes, hugs, and zero chores for you today. 💕</div>

  <div class="btn-row">
    <button id="jokeBtn">😂 Make me smile</button>
    <button id="hugBtn" class="secondary">🤗 Send a hug</button>
  </div>
  <div class="counter" id="counter">Smiles delivered: 0</div>
</div>

<script>
  const messages = [
    "I heard you’re not feeling your best — so I brought jokes, hugs, and zero chores for you today. 💕",
    "Why did the teddy bear say no to dessert? Because it was already stuffed. 🧸",
    "Fun fact: you’re still the best human I know, even on your worst day.",
    "Rest is productive too. Today your only job is existing (preferably with a snack).",
    "If being awesome were a full-time job, you’d still get overtime pay.",
    "Sending you an invisible blanket, invisible soup, and very visible love. 🍲",
    "You know what’s cuter than a puppy in a raincoat? You, feeling better soon.",
    "Plot twist: today you’re allowed to do absolutely nothing and it’s still a win.",
    "I’m not saying you’re my favorite person... okay I’m saying exactly that.",
    "Drink some water, take a nap, and know that someone out there is rooting hard for you. 🌟"
  ];

  let shown = 0;
  const msgEl = document.getElementById('message');
  const counterEl = document.getElementById('counter');
  let lastIndex = -1;

  document.getElementById('jokeBtn').addEventListener('click', () => {
    let i;
    do { i = Math.floor(Math.random() * messages.length); } while (i === lastIndex);
    lastIndex = i;
    msgEl.style.opacity = 0;
    setTimeout(() => {
      msgEl.textContent = messages[i];
      msgEl.style.opacity = 1;
      shown++;
      counterEl.textContent = "Smiles delivered: " + shown;
    }, 150);
  });

  const hugEmojis = ["🤗","💖","✨","🫂","💗","🌸"];
  document.getElementById('hugBtn').addEventListener('click', () => {
    const zone = document.getElementById('hugZone');
    for (let k = 0; k < 10; k++) {
      const span = document.createElement('span');
      span.className = 'popEmoji';
      span.textContent = hugEmojis[Math.floor(Math.random() * hugEmojis.length)];
      span.style.left = (45 + Math.random() * 10) + "vw";
      span.style.bottom = (10 + Math.random() * 10) + "vh";
      span.style.animationDelay = (Math.random() * 0.3) + "s";
      zone.appendChild(span);
      setTimeout(() => span.remove(), 2000);
    }
  });

  // floating hearts background
  const heartsContainer = document.getElementById('hearts');
  const heartChars = ["💗","💕","💖","✨","🌸"];
  function spawnHeart() {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
    h.style.left = Math.random() * 100 + "vw";
    const duration = 7 + Math.random() * 6;
    h.style.animationDuration = duration + "s";
    h.style.fontSize = (16 + Math.random() * 18) + "px";
    heartsContainer.appendChild(h);
    setTimeout(() => h.remove(), duration * 1000);
  }
  for (let i = 0; i < 8; i++) {
    setTimeout(spawnHeart, i * 500);
  }
  setInterval(spawnHeart, 1300);
</script>

</body>
</html>
